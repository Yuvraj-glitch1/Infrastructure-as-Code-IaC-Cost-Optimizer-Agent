# .github/workflows/ai-cost-optimizer.yml
name: AI Cost Optimizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"

# Required so the job can push the optimized commit back onto the PR branch
# and leave a comment on the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-cost-optimizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_DIR: terraform
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-sonnet-4-5

jobs:
  optimize:
    name: Analyze and right-size Terraform
    runs-on: ubuntu-latest
    # Skip the run when the last commit was made by this workflow, so the push
    # back to the branch does not retrigger the job in a loop.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Terraform init (backendless, for validation only)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -backend=false -input=false

      - name: Install Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: latest

      - name: Verify Infracost authentication
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost --version
          infracost configure get api_key > /dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture pre-optimization cost baseline
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path "${TERRAFORM_DIR}" \
            --format json \
            --out-file /tmp/infracost-baseline.json
          infracost output --path /tmp/infracost-baseline.json --format table

      - name: Run the optimizer agent
        id: optimizer
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
        run: |
          python optimizer.py \
            --terraform-dir "${TERRAFORM_DIR}" \
            --provider "${LLM_PROVIDER}" \
            --verbose

      - name: Detect file changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- '*.tf')" ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git --no-pager diff --stat -- '*.tf'
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform changes were produced."
          fi

      - name: Capture post-optimization cost
        if: steps.changes.outputs.dirty == 'true'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path "${TERRAFORM_DIR}" \
            --format json \
            --out-file /tmp/infracost-optimized.json
          echo "### Cost after optimization" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          infracost diff \
            --path "${TERRAFORM_DIR}" \
            --compare-to /tmp/infracost-baseline.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push optimized Terraform
        if: steps.changes.outputs.dirty == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.tf'
          git commit -m "chore(cost): AI-optimized Terraform right-sizing

          Automated by the IaC Cost Optimizer Agent.
          Estimated monthly savings: \$${{ steps.optimizer.outputs.savings || 'n/a' }}

          [skip ci]"

          git push origin "HEAD:${HEAD_REF}"

      - name: Comment on the pull request
        if: steps.changes.outputs.dirty == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const savings = "${{ steps.optimizer.outputs.savings }}" || "n/a";
            const files = "${{ steps.optimizer.outputs.changed_files }}" || "none";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "### AI Cost Optimizer",
                "",
                "I right-sized the Terraform in this PR and pushed a commit to your branch.",
                "",
                `**Estimated monthly savings:** $${savings}`,
                `**Files rewritten:** \`${files}\``,
                "",
                "Review the diff before merging — the agent optimizes aggressively for `dev` environments.",
              ].join("\n"),
            });

      - name: Report no-op
        if: steps.changes.outputs.dirty == 'false'
        run: echo "Infrastructure already right-sized; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
